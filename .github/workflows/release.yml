name: Release

# 1) Push tag v*     → creates a GitHub Release in draft (+ plugin ZIP)
# 2) Publish release → deploys to JetBrains Marketplace (secret PUBLISH_TOKEN)
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  draft-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin ZIP
        # configuration-cache off: avoids ClosedFileSystemException when indexing
        # ideaIC bundled plugins (com.intellij.java) on GitHub Actions runners.
        run: ./gradlew check verifyPlugin buildPlugin -Dorg.gradle.configuration-cache=false

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: build/distributions/*.zip
          body: |
            Draft release for `${{ github.ref_name }}`.

            **Next steps**
            1. Review the notes, the tagged commit, and the attached plugin ZIP.
            2. Confirm `pluginVersion` in `gradle.properties` is a **non-SNAPSHOT** release
               (must match this tag, e.g. tag `v0.1.0` → `pluginVersion=0.1.0`).
            3. Click **Publish release** to deploy the plugin to
               [JetBrains Marketplace](https://plugins.jetbrains.com/).

  publish-marketplace:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release version
        run: |
          VERSION="$(grep -E '^pluginVersion[[:space:]]*=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "pluginVersion not found in gradle.properties" >&2
            exit 1
          fi
          if echo "$VERSION" | grep -q 'SNAPSHOT$'; then
            echo "Refusing to publish SNAPSHOT version: $VERSION" >&2
            exit 1
          fi
          TAG="${{ github.event.release.tag_name }}"
          EXPECTED="v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag/version mismatch: tag=$TAG pluginVersion=$VERSION (expected tag $EXPECTED)" >&2
            exit 1
          fi
          echo "Publishing version: $VERSION (tag $TAG)"

      # Validation (check/verifyPlugin) already ran in draft-release on the same tag.
      # Re-running them here only re-triggers the flaky IDE layout index
      # (ClosedFileSystemException → missing bundled com.intellij.java).
      - name: Publish plugin to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "Secret PUBLISH_TOKEN is not set" >&2
            exit 1
          fi
          ./gradlew publishPlugin -Dorg.gradle.configuration-cache=false
