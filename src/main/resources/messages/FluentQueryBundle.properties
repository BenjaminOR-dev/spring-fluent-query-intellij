inspection.unresolved.path.message=Unknown path segment ''{0}''. It is not a field or association on the entity in scope — check spelling.

inspection.unresolved.path.dotted.attribute=''{0}'' contains dots, but {1}() only accepts a single attribute name on the current entity (e.g. \"email\"). For related data use whereRelatedEqual(\"rel\", \"column\", value), whereRelation(...), or whereHas(\"rel\", f -> ...). To eager-load use fetch(\"rel\").

inspection.unresolved.path.association.attribute=''{0}'' is an association/relationship, not a scalar column. {1}() filters one attribute — use whereHas(\"{0}\"), whereRelatedEqual(\"{0}\", \"column\", value), or whereRelation(\"{0}\", \"column\", value).

inspection.unresolved.path.colon.in.association=''{0}'' contains '':''. {1}() loads the full association (JOIN FETCH / existence) — column lists like \"rel:id,name\" are only valid in select(...). Use fetch(\"rel\") to load it, or select(\"rel:id,name\") to project columns.

inspection.unresolved.path.colon.in.property=''{0}'': the '':col1,col2'' shorthand is only for select(...). For orderBy/latest/oldest use a property path such as \"createdAt\" or \"profile.name\".

inspection.unresolved.path.non.basic.leaf=''{0}'' ends on an association or embeddable. This API needs a scalar column at the end (e.g. \"profile.bio\"). To project several columns of a relation use select(\"rel:col1,col2\").

inspection.unresolved.path.select.shorthand=''{0}'' is not a valid select shorthand. Use \"association:column\" or \"association:col1,col2\" (association before ':', at least one non-blank column after). Nested: \"company.address:city,zip\".

inspection.unresolved.path.single.segment=''{0}'' has dots, but {1}() only accepts a single association name (no nested path). For nested relations use FluentQuery.whereHas(\"a.b\") / fetch(\"a.b\") instead.

inspection.unresolved.path.empty.segment=Path ''{0}'' has an empty segment (look for leading/trailing dots or \"..\").

inspection.unresolved.path.duplicate=Duplicate path ''{0}'' in {1}(...). Each path should appear only once — remove the repeated argument.

inspection.fetch.with.projection.message={0}() cannot be combined with projection {1}(Class). Projections ignore join-fetch — remove fetch/with*, or use first()/get()/page() without a Class for entity results. For lean columns use select(...) without fetch.

inspection.fetch.collection.pagination.message={0}() cannot be combined with {1}(). Collection JOIN FETCH with pagination/limit is unsafe (cartesian product / LIMIT on the join). Remove fetchCollection/withCollection, use fetch() for to-one, or load collections in a second query.

inspection.deprecated.as.message={0}() is deprecated — use {1}(...) with a Class argument instead (Class last for page/paginate/slice).

inspection.select.without.projection.message=select(...) with {0}() still returns the entity; JPA cannot load a true partial entity. Prefer select(...).{0}(Projection.class) for lean columns, or omit select when you need the full entity.

